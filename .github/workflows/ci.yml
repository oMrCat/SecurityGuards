name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        working-directory: MFCTaskList
        run: msbuild MFCTaskList.sln -p:Configuration=Release -p:Platform=x64 -m -v:m

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: MFCTaskList-x64
          path: MFCTaskList/x64/Release/MFCTaskList.exe
